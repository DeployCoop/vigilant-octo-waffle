apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sample-app.fullname" . }}-html
  labels:
    {{- include "sample-app.labels" . | nindent 4 }}
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>{{ .Values.config.welcomeTitle }}</title>
      <style>
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          background: #090d16;
          color: #f1f5f9;
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          margin: 0;
        }
        .card {
          background: #111827;
          border: 1px solid #1e293b;
          border-radius: 12px;
          padding: 2.5rem;
          max-width: 540px;
          text-align: center;
          box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        h1 { color: #38bdf8; margin-top: 0; font-size: 1.5rem; }
        p { color: #94a3b8; line-height: 1.6; }
        .badge {
          display: inline-block;
          background: #0369a1;
          color: #e0f2fe;
          padding: 0.25rem 0.75rem;
          border-radius: 9999px;
          font-size: 0.75rem;
          font-weight: 600;
          margin-bottom: 1rem;
        }
      </style>
    </head>
    <body>
      <div class="card">
        <span class="badge">Vigilant Octo Waffle Custom Chart</span>
        <h1>{{ .Values.config.welcomeTitle }}</h1>
        <p>{{ .Values.config.welcomeMessage }}</p>
        <p><small style="color: #64748b;">Release: {{ .Release.Name }} | Version: {{ .Chart.Version }}</small></p>
      </div>
    </body>
    </html>
