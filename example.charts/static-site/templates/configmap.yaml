apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "static-site.fullname" . }}-content
  labels:
    {{- include "static-site.labels" . | nindent 4 }}
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="utf-8">
      <title>{{ .Values.site.heading }}</title>
      <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 3rem; text-align: center; }
        h1 { color: #38bdf8; }
        p { color: #94a3b8; font-size: 1.1rem; }
      </style>
    </head>
    <body>
      <h1>{{ .Values.site.heading }}</h1>
      <p>{{ .Values.site.bodyText }}</p>
    </body>
    </html>
