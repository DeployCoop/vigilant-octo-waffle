apiVersion: waffle.dev/v1
kind: WafflePipeline
metadata:
  name: example-ecosystem-pipeline
  version: 1.0.0
  description: "Example multi-stage pipeline orchestrating sample-app and static-site charts"
  authors:
    - name: "Vigilant Octo Waffle Platform"
      email: "devops@vigilant-octo-waffle.local"
  tags:
    - example
    - sample-app
    - static-site
    - showcase

settings:
  defaultNamespace: default
  defaultStorageClass: local-path
  defaultClusterIssuer: mkcert-issuer
  globalTimeout: 15m
  rollbackOnFailure: true

preflight:
  storage:
    requireStorageClass: local-path
    autoInstallOpenEBS: false
  ingress:
    requireController: nginx
  resources:
    minCpuCores: 2
    minMemoryGb: 4

keys:
  secrets:
    - name: example-app-secrets
      namespace: default
      literals:
        API_SECRET_KEY: "demo-secret-key-change-in-prod"
        SESSION_SALT: "randomized-salt-value"

builds:
  registry: "localhost:5001"
  gitops:
    engine: "waffle"
    branch: "main"
    autoBuildOnPush: false
    webhookPath: "/api/gitops/webhook"
  targets:
    - name: sample-app
      context: ./sample-app
      image: sample-app/nginx
      tag: "1.25.0"

stages:
  - id: 00-foundation-config
    name: "Foundation & Secrets Configuration"
    description: "Ensure namespace and secrets are provisioned before application services"
    mode: series
    steps:
      - id: sample-app-bootstrap
        name: "Sample App Pre-requisites"
        chart: ./sample-app
        namespace: default
        createNamespace: true
        wait: true
        timeout: 3m
        set:
          replicaCount: 1
          ingress.enabled: false
        healthCheck:
          type: podReady
          timeout: 2m

  - id: 10-application-services
    name: "Application Web Services"
    description: "Deploy customer-facing application services in parallel"
    mode: parallel
    dependsOn:
      - 00-foundation-config
    steps:
      - id: sample-app-production
        name: "Production Sample App Service"
        chart: ./sample-app
        namespace: default
        wait: true
        timeout: 5m
        set:
          replicaCount: 2
          ingress.enabled: true
          ingress.host: "sample-app.local"
        healthCheck:
          type: http
          url: "http://sample-app.local/healthz"
          expectedStatus: 200
          timeout: 2m

      - id: static-docs-site
        name: "Static Documentation Site"
        chart: ./static-site
        namespace: default
        wait: true
        timeout: 3m
        set:
          replicaCount: 1
          ingress.enabled: true
          ingress.host: "docs.local"
        healthCheck:
          type: podReady
          timeout: 2m
