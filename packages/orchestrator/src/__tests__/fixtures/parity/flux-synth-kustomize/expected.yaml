apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: mariadb-operator-crds-repo
  namespace: flux-system
spec:
  interval: 5m
  ref:
    branch: main
  url: https://github.com/DeployCoop/urban-disco.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mariadb-operator-crds
  namespace: flux-system
spec:
  interval: 5m
  path: ./charts/mariadb-operator-crds
  prune: true
  sourceRef:
    kind: GitRepository
    name: mariadb-operator-crds-repo
  targetNamespace: parity-test
