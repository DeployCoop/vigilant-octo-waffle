apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: bao-repo
  namespace: flux-system
spec:
  interval: 5m
  ref:
    branch: main
  url: https://github.com/joshuacox/argocd-tests.git
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: parity-test
spec:
  chart:
    spec:
      chart: charts/openbao
      sourceRef:
        kind: GitRepository
        name: bao-repo
        namespace: flux-system
  interval: 5m
  targetNamespace: parity-test
  values:
    global:
      enabled: true
      namespace: parity-test
      tlsDisable: true
    server:
      dataStorage:
        enabled: true
        size: 2Gi
        storageClass: example-hostpath
    ui:
      enabled: true
      serviceType: ClusterIP
