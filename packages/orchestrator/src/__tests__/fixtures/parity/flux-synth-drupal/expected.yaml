      args: []
      autoscaling:
        enabled: false
        maxReplicas: 11
        minReplicas: 1
        targetCPUUtilizationPercentage: 50
        targetMemoryUtilizationPercentage: 50
      backup:
        cleanup:
          enabled: false
        enabled: false
        filesArgs: ""
        persistence:
          accessMode: ReadWriteOnce
          annotations: {}
          enabled: false
          size: 8Gi
          storageClass: example-hostpath
        privateArgs: ""
        schedule: 0 0 * * *
        sqlDumpArgs: ""
        volume: {}
      cacheRebuildBeforeDatabaseMigration: true
      command: []
      configSplit:
        enabled: false
      configSync:
        directory: /private/config/sync
      cron:
        enabled: true
        failedJobsHistoryLimit: 1
        preInstallScripts: ""
        schedule: 0 * * * *
        successfulJobsHistoryLimit: 3
      dbAvailabilityScript: >-
        until drush sql:query 'SHOW TABLES;'; do echo Waiting for DB; sleep 3;
        done

        echo DB available
      disableDefaultFilesMount: false
