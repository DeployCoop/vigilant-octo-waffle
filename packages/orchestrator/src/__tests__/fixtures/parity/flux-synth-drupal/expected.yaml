          - private
          - public
          - tmp
        initMediaIconsFolder: true
        private:
          spec: {}
        protocol: smb
        public:
          spec: {}
        size: 256Gi
        skuName: Standard_LRS
        storageClass: example-hostpath
        tmp:
          spec: {}
      sharedDisk:
        accessMode: ReadWriteMany
        annotations: {}
        enabled: false
        folders:
          - private
          - public
        initMediaIconsFolder: true
        maxShares: 2
        private:
