apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: drupal-repo
  namespace: flux-system
spec:
  interval: 5m
  ref:
    branch: main
  url: https://github.com/DeployCoop/urban-disco.git
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: drupal
  namespace: parity-test
spec:
  chart:
    spec:
      chart: charts/drupal
      sourceRef:
        kind: GitRepository
        name: drupal-repo
