name: githubio

# Builds the static project site in apps/githubio and deploys it to GitHub
# Pages. PRs get a build-only check; deploys happen from main.
# One-time setup: repository Settings -> Pages -> Source = GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'apps/githubio/**'
      - '.github/workflows/githubio.yml'
  pull_request:
    paths:
      - 'apps/githubio/**'
      - '.github/workflows/githubio.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        # --ignore-scripts: the site is standalone (no @vow/orchestrator
        # dependency), and a plain install would run the orchestrator's
        # prepare build, coupling this workflow to the engine's health.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build static export
        env:
          # A project Pages site is served from /<repo-name>; PR builds
          # verify the root-served variant instead.
          GITHUBIO_BASE_PATH: ${{ github.event_name != 'pull_request' && '/vigilant-octo-waffle' || '' }}
        run: pnpm --filter @vow/githubio build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/githubio/out

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
