name: Dependabot auto-merge

# Plan II §5.2 (§16 Q6): patch-level *grouped* Dependabot PRs get
# auto-merge armed, so they land as soon as the six required checks pass
# and the required review lands; minor/major updates and ungrouped
# (e.g. security-update) PRs stay fully manual.
#
# Why no automated approval: the DeployCoop org policy forbids GitHub
# Actions from creating or approving pull requests (the addPullRequestReview
# mutation is rejected), so the review stays a human click and this workflow
# only arms auto-merge. If the org setting "Allow GitHub Actions to create
# and approve pull requests" is ever enabled, add back a
# `gh pr review --approve "$PR_URL"` step before the merge command to make
# patch PRs fully hands-off.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge for grouped patch updates
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' && steps.meta.outputs.dependency-group != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
