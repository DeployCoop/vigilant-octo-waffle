name: Dependabot auto-merge

# Plan II §5.2 (§16 Q6): patch-level *grouped* Dependabot PRs land on their
# own once the six required checks pass; minor/major updates and ungrouped
# (e.g. security-update) PRs stay manual. The approval posted here is
# deliberately narrow: Dependabot author, grouped PR, semver-patch only.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Approve and enable auto-merge for grouped patch updates
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' && steps.meta.outputs.dependency-group != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --merge "$PR_URL"
