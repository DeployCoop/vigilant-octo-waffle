name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Checksum-pinned install (Plan III §8.1): Dependabot does not track
      # curl installs, so bump GITLEAKS_VERSION and GITLEAKS_SHA256 together.
      # The digest is the linux_x64 line of the release's official
      # gitleaks_<version>_checksums.txt.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.28.0"
          GITLEAKS_SHA256="a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
          curl -sSL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xz -C /tmp -f /tmp/gitleaks.tar.gz gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      # Scan only the change range (PR commits, or the pushed range), not
      # all of history: history carries audited example content that
      # .gitleaks.toml documents. Config is auto-loaded from the repo root.
      - name: Scan the change range for secrets
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE="-n 1"
          fi
          gitleaks git --redact --log-opts="$RANGE" .

  test:
    name: Tests & typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # pnpm version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The orchestrator smoke tests exercise the real `helm lint` /
      # `helm template` against the example chart, so the binary must exist.
      # kubectl is deliberately NOT installed: the storage tests stub it
      # (see packages/orchestrator/src/__tests__/storage.test.ts), and no
      # test needs a live cluster.
      # Helm version must match the Dockerfile's HELM_VERSION pin (Plan III
      # §8.2): the image is what users run, so CI tests that same helm.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.17.1

      # The bash<->TS parity tests (WS3) shell out to the bash runners,
      # which need yq (manifest merging) and envsubst (templating).
      # VOW_PARITY_REQUIRED makes a missing tool a failure rather
      # than a skip, so parity cannot silently void in CI.
      # yq is checksum-pinned (Plan III §8.1): Dependabot does not track
      # curl installs, so bump YQ_VERSION and YQ_SHA256 together. The digest
      # is the SHA-256 entry for yq_linux_amd64 in the release's official
      # `checksums` file.
      - name: Install parity tools (yq, envsubst)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gettext-base
          YQ_VERSION="v4.44.5"
          YQ_SHA256="638c4b251c49201fc94b598834b715f8f1c6e9b1854d2820772d2c79f0289002"
          curl -fsSL -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq

      # The TLS helper tests exercise the real `mkcert` binary to
      # generate a dev certificate, so it must exist.
      # NOTE (Plan III §8.1): mkcert publishes no checksum file for its
      # release binaries (verified 2026-10-21), so this install is the
      # documented exception to checksum pinning.
      - name: Install mkcert
        run: |
          sudo curl -fsSL -o /usr/local/bin/mkcert "https://github.com/FiloSottile/mkcert/releases/download/v1.4.4/mkcert-v1.4.4-linux-amd64"
          sudo chmod +x /usr/local/bin/mkcert

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # VOW_BINARY_REQUIRED gives the helm/mkcert-gated tests the same
      # skip-or-fail semantics as parity (skipOrFailBinary in
      # packages/orchestrator/src/__tests__/helpers.ts): a binary that
      # vanishes from the runner fails the suite itself, instead of a
      # separate step re-running the tests and grepping captured output
      # for `skipped 0` (that assertion flaked twice on empty captures).
      - name: Orchestrator tests
        env:
          VOW_PARITY_REQUIRED: '1'
          VOW_BINARY_REQUIRED: '1'
        run: |
          pnpm --filter @vow/orchestrator build
          pnpm --filter @vow/orchestrator test

      - name: Web tests
        run: pnpm --filter @vow/web test

      - name: Ink tests
        run: |
          pnpm --filter @vow/ink build
          pnpm --filter @vow/ink test

      - name: Typecheck (web + ink + githubio; orchestrator typechecks via its build)
        run: |
          pnpm --filter @vow/web typecheck
          pnpm --filter @vow/ink typecheck
          pnpm --filter @vow/githubio typecheck

  build:
    name: Production build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Root build: orchestrator -> ink -> web (web's prebuild also builds
      # the orchestrator it bundles).
      - name: Build all packages
        run: pnpm build

      # The Dockerfile is the shipped artifact: prove it builds, that
      # the runtime inside it is the declared Node version (.nvmrc),
      # that the pruned runner image runs as the non-root node user,
      # and that it actually boots and answers HTTP (Plan III §8.4).
      - name: Build Docker image and verify its Node version
        run: |
          docker build -t vow-web:ci .
          docker run --rm vow-web:ci node --version | tee /tmp/nodever
          grep -E '^v24\.' /tmp/nodever
          docker images vow-web:ci
          # §8.4: the runner stage's default user is node (uid 1000).
          docker run --rm --entrypoint id vow-web:ci | tee /tmp/imguser
          grep -E '^uid=1000\(node\)' /tmp/imguser
          # Boot smoke: start the image with its default CMD and poll
          # until the control plane answers HTTP. 200 / a redirect to
          # the login page / 401 all prove the server is up; a refused
          # connection does not, and the step fails if none arrive.
          docker run -d --name vow-web-smoke -p 3000:3000 vow-web:ci
          ok=""
          for i in $(seq 1 60); do
            if ! docker inspect -f '{{.State.Running}}' vow-web-smoke 2>/dev/null | grep -q '^true$'; then
              echo "container is no longer running on attempt $i"
              break
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)
            case "$code" in
              200|301|302|303|307|308|401) ok=1; echo "app answered HTTP $code on attempt $i"; break ;;
            esac
            sleep 2
          done
          docker logs vow-web-smoke || true
          docker rm -f vow-web-smoke || true
          test -n "$ok"

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Plan III §7.1: the 1,000-line rule. WARN ONLY — the step always
      # exits 0; per the Q3 decision (2026-10-21) it becomes a failure in
      # a later cycle. It needs no toolchain (git + wc), so it runs
      # before setup. Tracked source = ts/tsx under apps/ and packages/,
      # excluding tests and the generated next-env.d.ts (CONTRIBUTING.md).
      - name: File-size warning (1,000-line rule, non-blocking)
        run: |
          offenders=0
          while IFS= read -r file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt 1000 ]; then
              echo "::warning file=$file::Source file is $lines lines, over the 1,000-line rule — split it along its natural seams (Plan III §7.1)"
              offenders=$((offenders + 1))
            fi
          done < <(git ls-files 'apps' 'packages' | grep -E '\.tsx?$' | grep -vE '\.test\.tsx?$|__tests__/|next-env\.d\.ts$')
          echo "Source files over 1,000 lines: $offenders (warning only — becomes a failure in a later cycle)"
          exit 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint all packages
        run: pnpm -r lint

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # NOTE (Plan III §8.1): ShellCheck publishes no checksum file for its
      # release tarballs (verified 2026-10-21), so this install is the
      # documented exception to checksum pinning.
      - name: Install ShellCheck
        run: |
          curl -sSL https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz | tar -xJ
          sudo install -m 0755 shellcheck-v0.10.0/shellcheck /usr/local/bin/shellcheck

      # Gate at error severity (plan §5.2, §16 Q3 decided). Warning-level
      # findings are a tracked burn-down, not a gate; the only permitted
      # suppressions are per-line `# shellcheck disable=SCxxxx` comments
      # carrying a justification.
      - name: ShellCheck (error severity)
        run: shellcheck --severity=error src/*.bash src/*.sh up bin/vow

      # Plan II §6.2: the warning count may only shrink. Lower the budget
      # file in the same PR that lowers the count.
      - name: ShellCheck warning budget
        run: |
          count=$(shellcheck --severity=warning --format=gcc src/*.bash src/*.sh up bin/vow | grep -cE ': (warning|error):' || true)
          budget=$(cat .github/shellcheck-warning-budget.txt)
          echo "ShellCheck warnings: ${count} (budget: ${budget})"
          if [ "${count}" -gt "${budget}" ]; then
            echo "::error::ShellCheck warning count ${count} exceeds budget ${budget}"
            exit 1
          fi

  shell-tests:
    name: Shell tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Plan II §6.1: stubbed-binary regression tests for the k3s scripts.
      - name: Run shell script tests
        run: bash scripts/tests/run.sh
