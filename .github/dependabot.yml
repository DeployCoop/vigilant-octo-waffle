# Dependabot configuration — improvements plan WS1 (§4.2), §16 Q9 decided:
# grouped weekly PRs, manual merge (CI-gated). Revisit patch-level
# auto-merge after the first month.
version: 2
updates:
  # pnpm workspace: the npm ecosystem at the root reads the workspace and
  # updates pnpm-lock.yaml.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@next/*"
          - "eslint-config-next"
      tooling:
        patterns:
          - "typescript"
          - "vitest"
          - "@vitejs/*"
          - "@types/*"
          - "typescript-eslint"
    ignore:
      # TypeScript majors stay out until typescript-eslint supports them
      # (TS 7 support is tracked in typescript-eslint#10940; the TS 7 bump
      # in PR #39 left Lint red for a week). Remove this ignore when a
      # typescript-eslint release widens its peer range past 7.x.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Keeps the digest-pinned Dockerfile base image (Node 24) fresh.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      # The project standard is Node 24 (plan §16 Q1: .nvmrc, engines,
      # CI version gate). A node major is a deliberate runtime-alignment
      # change, not a weekly bump — PR #34's node 26 image broke the
      # build (no corepack) and had to be reverted in PR #60.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
