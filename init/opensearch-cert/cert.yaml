apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: opensearch-certs
  namespace: ${THIS_OPENSEARCH_NAMESPACE}
spec:
  secretName: opensearch-tls-secret
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days
  isCA: false
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  usages:
    - server auth
    - client auth
  dnsNames:
    - opensearch-cluster # Your OpenSearch internal service name
    - opensearch-cluster.opensearch.svc.cluster.local
  issuerRef:
    name: ${THIS_CLUSTER_ISSUER}
    kind: ClusterIssuer
