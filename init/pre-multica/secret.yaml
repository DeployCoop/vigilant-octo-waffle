apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: multica-secrets
  namespace: ${THIS_NAMESPACE}
stringData:
  # Generated at cluster setup from src/default.env (bash-evaluated there;
  # the operator's .env carries the real values into the web deploy path).
  JWT_SECRET: "${THIS_MULTICA_JWT_SECRET}"
  POSTGRES_PASSWORD: "${THIS_MULTICA_POSTGRES_PASSWORD}"
  # Optional: leave empty until the operator configures them.
  # RESEND_API_KEY sends real email login codes; without it the code is
  # printed to the backend pod logs instead.
  RESEND_API_KEY: "${THIS_MULTICA_RESEND_API_KEY}"
  GOOGLE_CLIENT_SECRET: "${THIS_MULTICA_GOOGLE_CLIENT_SECRET}"
  CLOUDFRONT_PRIVATE_KEY: "${THIS_MULTICA_CLOUDFRONT_PRIVATE_KEY}"
  # Deliberately absent: MULTICA_DEV_VERIFICATION_CODE. Never set a fixed
  # dev verification code; anyone who knows an email address could log in
  # with it. See argo/multica/README.md.
