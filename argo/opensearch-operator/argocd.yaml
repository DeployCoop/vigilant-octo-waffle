metadata:
  name: opensearch-operator-${THIS_NAMESPACE}
  namespace: argocd
spec:
  destination:
    namespace: ${THIS_OPENSEARCH_NAMESPACE}
    server: https://kubernetes.default.svc
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ServerSideApply=false
  source:
    repoURL: https://opensearch-project.github.io/opensearch-k8s-operator/
    chart: opensearch-operator
    targetRevision: 3.0.14
    helm:
      values: |
        manager:
          extraEnv:
            OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
