metadata:
  name: spegel-${THIS_NAMESPACE}
  namespace: argocd
spec:
  destination:
    namespace: ${THIS_NAMESPACE}
    server: https://kubernetes.default.svc
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ServerSideApply=false
  source:
    repoURL: oci://ghcr.io/spegel-org/helm-charts/spegel
    chart: spegel
    targetRevision: 0.8.1
    helm:
      values: |
        global:
          extraEnv:
            ENV_VAR1: ${THIS_ENV_VAR1}
