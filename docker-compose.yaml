services:
  control-plane:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vow-control-plane
    ports:
      # Bound strictly to 127.0.0.1 (localhost only) to prevent host/cluster takeover
      # via the mounted Docker socket (/var/run/docker.sock), kubeconfig, and .secrets.
      # DO NOT bind to 0.0.0.0 or expose to external/untrusted networks!
      - "127.0.0.1:3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.kube:/root/.kube:ro
      - ./.env:/app/.env
      - ./.env.enabler:/app/.env.enabler
      - ./.secrets:/app/.secrets
      - ./.argo_overrides:/app/.argo_overrides
    environment:
      - NODE_ENV=production
    restart: unless-stopped
