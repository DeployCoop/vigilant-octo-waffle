services:
  control-plane:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vow-control-plane
    ports:
      # Bound to 127.0.0.1 to avoid exposing the control plane, Docker socket, and cluster secrets to the external network
      - "127.0.0.1:3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.kube:/root/.kube:ro
      - ./.env:/app/.env
      - ./.env.enabler:/app/.env.enabler
      - ./.secrets:/app/.secrets
      - ./.argo_overrides:/app/.argo_overrides
    environment:
      - NODE_ENV=production
    restart: unless-stopped
