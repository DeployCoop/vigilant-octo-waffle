apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik-repo
  namespace: ${THIS_FLUX_NAMESPACE}
spec:
  interval: ${THIS_FLUX_INTERVAL}
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: ${THIS_FLUX_INTERVAL}
  targetNamespace: traefik
  chart:
    spec:
      chart: traefik
      version: ">=20.0.0"
      sourceRef:
        kind: HelmRepository
        name: traefik-repo
        namespace: ${THIS_FLUX_NAMESPACE}
  values:
    ports:
      web:
        port: 8000
        exposedPort: 80
      websecure:
        port: 8443
        exposedPort: 443
    ingressRoute:
      dashboard:
        enabled: false
